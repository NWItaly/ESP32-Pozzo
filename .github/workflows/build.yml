name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # In CI non servono secret reali: bastano valori fittizi con lo
      # stesso "shape" per far passare la validazione e la compilazione.
      - name: Create dummy secrets.yaml
        run: |
          cat > secrets.yaml << 'EOF'
          api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          ota_password: "dummy-ota-password"
          web_server_username: "admin"
          web_server_password: "dummy-web-password"
          EOF

      - name: ESPHome config validation
        uses: esphome/build-action@v8.0.0
        with:
          yaml-file: water-level.yaml
          version: latest
